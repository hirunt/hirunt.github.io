<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thish</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top left, #0f0f0f, #1a1a1a, #000);
      color: #f5f5f5;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }

    .container {
      max-width: 650px;
      animation: fadeIn 2s ease-in-out;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #FFD700;
      letter-spacing: 1px;
      animation: glow 2s ease-in-out infinite alternate;
    }

    p {
      font-size: 1.2rem;
      opacity: 0.85;
      margin-bottom: 1rem;
    }

    .stay-tuned {
      font-size: 1.5rem;
      font-weight: 600;
      color: #FFD700;
      margin-bottom: 2rem;
      animation: bounce 1.5s infinite;
    }

    .links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 500;
      text-decoration: none;
      color: #fff;
      background: #222;
      border: 2px solid #FFD700;
      border-radius: 50px;
      transition: all 0.3s ease-in-out;
      min-width: 150px;
    }

    .links a i {
      margin-right: 8px;
      font-size: 1.2rem;
    }

    .links a:hover {
      background: #FFD700;
      color: #111;
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 8px 20px rgba(255, 215, 0, 0.4);
    }

    /* Mobile View: stack buttons */
    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }
      p {
        font-size: 1rem;
      }
      .stay-tuned {
        font-size: 1.2rem;
      }
      .links {
        flex-direction: column;
        gap: 12px;
      }
      .links a {
        width: auto;
      }
    }

    /* Fade In Animation */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Neon Glow Effect */
    @keyframes glow {
      from {
        text-shadow: 0 0 10px #FFD700, 0 0 20px #FFD700, 0 0 30px #ffecb3;
      }
      to {
        text-shadow: 0 0 20px #ffecb3, 0 0 40px #FFD700, 0 0 60px #ffecb3;
      }
    }

    /* Bounce Animation for "Stay Tuned" */
    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-6px);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Coming Soon</h1>
    <p>I’m working on something awesome!</p>
    <div class="stay-tuned">✨ Stay Tuned ✨</div>
    <div class="links">
      <a href="mailto:hirunthishakya.wmh25@gmail.com"><i class="fas fa-envelope"></i>Email</a>
      <a href="www.linkedin.com/in/thishakya"><i class="fab fa-linkedin"></i>LinkedIn</a>
      <a href="https://github.com/thishakyawmh" target="_blank"><i class="fab fa-github"></i>GitHub</a>
    </div>
  </div>
</body>
</html>
